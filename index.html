<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Canteen - Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">S</span>
        <span>School Canteen</span>
      </a>
      <a class="cart-link" href="cart.html">
        Cart
        <span id="cart-count" class="cart-badge is-empty">0</span>
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <span class="hero-emoji">&#127860;</span>
      <h1>School Canteen</h1>
      <p>Pick your favorites and add them to your cart.</p>
    </section>

    <div class="container">
      <div class="category-tabs" id="category-tabs">
        <button class="tab-btn active" data-cat="all">All</button>
        <button class="tab-btn" data-cat="Meals">&#127858; Meals</button>
        <button class="tab-btn" data-cat="Snacks">&#127871; Snacks</button>
        <button class="tab-btn" data-cat="Drinks">&#129380; Drinks</button>
        <button class="tab-btn" data-cat="Desserts">&#127856; Desserts</button>
      </div>
      <div id="menu"></div>
    </div>
  </main>

  <footer class="site-footer">
    CCTC School Canteen &middot; Mon - Fri, 7:30 AM - 4:00 PM
  </footer>

  <script src="data/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
