<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="30">
  <meta name="description" content="CCTC School Canteen Now Serving board.">
  <title>School Canteen - Now Serving</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff6b35'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='36' font-weight='900' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="board-body">
  <main class="board">
    <p class="board-kicker">CCTC School Canteen</p>
    <div class="board-grid">
      <section class="board-panel serving">
        <h2>Now Serving</h2>
        <div id="board-serving" class="board-numbers"></div>
      </section>
      <section class="board-panel preparing">
        <h2>Preparing</h2>
        <div id="board-preparing" class="board-numbers small"></div>
      </section>
    </div>
    <p class="board-foot">Pay at the counter → wait for your queue number → claim. <a href="admin.html">Cashier</a> · <a href="index.html">Menu</a></p>
  </main>
  <script src="data/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function fmtQ(o) { return '#' + String(o.queueNumber != null ? o.queueNumber : '?').padStart(3, '0'); }
    function renderBoard() {
      const servingEl = document.getElementById('board-serving');
      const prepEl = document.getElementById('board-preparing');
      if (!servingEl || !prepEl) return;
      const today = getTodayOrders();
      const serving = today.filter((o) => o.status === 'Ready').slice(0, 3);
      const preparing = today.filter((o) => ['Paid', 'To Pay at Counter'].includes(o.status)).slice(0, 8);
      servingEl.innerHTML = '';
      prepEl.innerHTML = '';
      if (!serving.length) {
        servingEl.innerHTML = '<span class="board-empty">—</span>';
      } else {
        serving.forEach((o) => {
          const s = document.createElement('span');
          s.className = 'board-number';
          s.textContent = fmtQ(o);
          servingEl.appendChild(s);
        });
      }
      if (!preparing.length) {
        prepEl.innerHTML = '<span class="board-empty">No orders in queue</span>';
      } else {
        preparing.forEach((o) => {
          const s = document.createElement('span');
          s.className = 'board-number dim';
          s.textContent = fmtQ(o);
          prepEl.appendChild(s);
        });
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      renderBoard();
      setInterval(renderBoard, 3000);
      window.addEventListener('storage', renderBoard);
    });
  </script>
</body>
</html>
